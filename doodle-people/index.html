<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee9dc">
<title>Ugly Little People</title>
<style>
  :root{
    --ink:#27231f; --paper:#eee9dc; --cream:#d9c28f; --rose:#b47b74;
    --blue:#87919a; --green:#87958c; --skin:#d6a47e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#dedbd2;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
  body{min-height:100svh;display:flex;align-items:flex-start;justify-content:center;padding:0}
  .page{
    width:min(100%,720px); background:var(--paper); position:relative; overflow:hidden;
    box-shadow:0 0 30px rgba(40,35,30,.12);
  }
  .tip{
    position:absolute;z-index:20;left:14px;bottom:14px;
    background:rgba(238,233,220,.84);border:1px solid rgba(39,35,31,.22);
    border-radius:999px;padding:8px 11px;font:12px/1.2 system-ui,-apple-system,sans-serif;
    backdrop-filter:blur(7px);pointer-events:none;transition:opacity .5s;
  }
  svg{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .ink{fill:none;stroke:var(--ink);stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .thin{stroke-width:1.55}
  .scratch{stroke-width:1.15;opacity:.85}
  .fill-skin{fill:rgba(214,164,126,.22)}
  .fill-cream{fill:rgba(217,194,143,.28)}
  .fill-rose{fill:rgba(180,123,116,.22)}
  .fill-blue{fill:rgba(135,145,154,.20)}
  .fill-green{fill:rgba(135,149,140,.20)}
  .person{cursor:pointer;transform-box:fill-box;transform-origin:center}
  .person .part{transform-box:fill-box;transform-origin:center}
  .person:focus{outline:none}
  .person:focus-visible .focus-ring{opacity:1}
  .focus-ring{fill:none;stroke:#74675c;stroke-width:2;stroke-dasharray:4 6;opacity:0;vector-effect:non-scaling-stroke}
  .motion{opacity:0}
  .idle-a{animation:idleA 4.6s ease-in-out infinite}
  .idle-b{animation:idleB 3.7s ease-in-out infinite}
  .idle-c{animation:idleC 5.1s ease-in-out infinite}
  .idle-d{animation:idleD 4.2s ease-in-out infinite}
  .idle-e{animation:idleE 5.4s ease-in-out infinite}
  @keyframes idleA{0%,100%{transform:rotate(-.35deg)}50%{transform:rotate(.65deg) translateY(-1px)}}
  @keyframes idleB{0%,100%{transform:translateY(0)}50%{transform:translateY(2px) rotate(.7deg)}}
  @keyframes idleC{0%,100%{transform:rotate(.25deg)}50%{transform:rotate(-.55deg) translateY(-1px)}}
  @keyframes idleD{0%,100%{transform:rotate(-.2deg)}50%{transform:rotate(.6deg) translateX(1px)}}
  @keyframes idleE{0%,100%{transform:translateX(0)}50%{transform:translateX(1px) rotate(.25deg)}}
  .person.hit-a{animation:hitA .72s cubic-bezier(.2,.8,.2,1)}
  .person.hit-b{animation:hitB .62s ease-out}
  .person.hit-c{animation:hitC .75s ease-out}
  .person.hit-d{animation:hitD .7s ease-out}
  .person.hit-e{animation:hitE .78s ease-out}
  .person.hit-a .head{animation:headA .72s ease-out}
  .person.hit-c .tie{animation:tie .75s ease-out}
  .person.hit-d .head{animation:headD .7s ease-out}
  .person.hit-e .arm{animation:arm .78s ease-out}
  .person.hit-b .eyes{animation:blink .62s ease-out}
  .person.hit-a .motion,.person.hit-b .motion,.person.hit-c .motion,.person.hit-d .motion,.person.hit-e .motion{animation:lines .7s ease-out}
  @keyframes hitA{0%{transform:rotate(0)}28%{transform:rotate(-5deg) translate(-5px,-3px)}52%{transform:rotate(4deg) translate(4px,1px)}75%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
  @keyframes hitB{0%{transform:scale(1)}30%{transform:scale(1.06,.92) translateY(4px)}56%{transform:scale(.98,1.04) translateY(-3px)}100%{transform:scale(1)}}
  @keyframes hitC{0%{transform:rotate(0)}32%{transform:rotate(4deg) translateY(5px)}58%{transform:rotate(-3deg) translateY(-2px)}100%{transform:rotate(0)}}
  @keyframes hitD{0%{transform:translate(0)}25%{transform:translate(-7px,-4px) rotate(-4deg)}48%{transform:translate(6px,2px) rotate(4deg)}72%{transform:translate(-3px,0) rotate(-2deg)}100%{transform:translate(0)}}
  @keyframes hitE{0%{transform:translateX(0)}24%{transform:translateX(7px) rotate(2deg)}48%{transform:translateX(-6px) rotate(-1.5deg)}72%{transform:translateX(3px)}100%{transform:translateX(0)}}
  @keyframes headA{0%,100%{transform:rotate(0)}40%{transform:rotate(8deg)}68%{transform:rotate(-4deg)}}
  @keyframes headD{0%,100%{transform:translateY(0)}35%{transform:translateY(-11px) rotate(-5deg)}65%{transform:translateY(3px) rotate(3deg)}}
  @keyframes tie{0%,100%{transform:rotate(0)}40%{transform:rotate(12deg)}70%{transform:rotate(-7deg)}}
  @keyframes arm{0%,100%{transform:rotate(0)}35%{transform:rotate(-13deg)}68%{transform:rotate(7deg)}}
  @keyframes blink{0%,30%,70%,100%{transform:scaleY(1)}45%,56%{transform:scaleY(.15)}}
  @keyframes lines{0%{opacity:0}25%{opacity:.85}100%{opacity:0}}
  .tapdot{pointer-events:none;position:absolute;width:12px;height:12px;border:1px solid var(--ink);border-radius:50%;transform:translate(-50%,-50%) scale(.3);opacity:0}
  .tapdot.go{animation:tapdot .52s ease-out}
  @keyframes tapdot{0%{opacity:.65;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(3)}}
  @media(prefers-reduced-motion:reduce){
    .person,.part{animation:none!important}
    .tip{display:none}
  }
</style>
</head>

<script>
(() => {
  const page = document.getElementById('page');
  const tip = document.getElementById('tip');
  const dot = document.getElementById('tapdot');
  const people = [...document.querySelectorAll('.person')];
  let used = false;

  const hitClass = {p1:'hit-a',p2:'hit-b',p3:'hit-c',p4:'hit-d',p5:'hit-e'};

  function animatePerson(el, ev){
    const c = hitClass[el.id];
    el.classList.remove(c);
    void el.getBoundingClientRect();
    el.classList.add(c);

    if (ev && ev.clientX != null) {
      const r = page.getBoundingClientRect();
      dot.style.left = (ev.clientX-r.left) + 'px';
      dot.style.top = (ev.clientY-r.top) + 'px';
      dot.classList.remove('go'); void dot.offsetWidth; dot.classList.add('go');
    }
    if(!used){used=true; tip.style.opacity='0';}
    setTimeout(()=>el.classList.remove(c),820);
  }

  people.forEach(el => {
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      animatePerson(el,e);
    }, {passive:false});
    el.addEventListener('keydown', e => {
      if(e.key==='Enter' || e.key===' '){e.preventDefault();animatePerson(el);}
    });
  });

  document.getElementById('drawing').addEventListener('pointerdown', e => {
    if(e.target.closest('.person')) return;
    if(!used){tip.textContent='要摸到小人本身 :)';}
  });

  // Small automatic movement so the page feels alive even before the first touch.
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    setTimeout(()=>animatePerson(document.getElementById('p2')),900);
    setTimeout(()=>animatePerson(document.getElementById('p4')),1700);
  }
})();
</script>
</body>
</html>
